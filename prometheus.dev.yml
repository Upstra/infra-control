global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Backend lancé sur la machine hôte (pnpm start:dev, port 3000)
  - job_name: 'infra-control-backend'
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
